name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: predictive-monitoring-tool-rg
  CONTAINER_APP_NAME: predictive-monitoring-tool-app
  IMAGE_NAME: predictive-monitoring-tool
  # Phase 9 Work Unit 7: repo variable, not a secret — the ACR login server
  # isn't sensitive. Set once via
  # `gh variable set ACR_LOGIN_SERVER --body "$(terraform -chdir=infra/terraform output -raw acr_login_server)"`
  # (kept in sync automatically thereafter by
  # infra/terraform/ci_identity.tf's null_resource on every apply). Replaces
  # the `az acr list` call this workflow used to make, which required at
  # least Reader on the whole resource group.
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_LOGIN_SERVER"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Train model
        run: uv run python -m predictive_monitoring_tool.models.train

      - name: Upload model metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: models/*.metadata.json

      - name: Build and push image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Phase 9 monitoring stack (infra/terraform/monitoring.tf): custom
      # Prometheus/Grafana images bake in config-as-code (scrape target,
      # dashboard provisioning) since Container Apps has no bind-mount
      # equivalent. Built here because this sandbox has neither local
      # Docker nor `az acr build` (ACR Tasks disabled on this
      # subscription) — CI's runner has Docker preinstalled and already
      # holds the OIDC-authenticated ACR session from the step above.
      - name: Build and push monitoring images
        run: |
          docker build -t "$ACR_LOGIN_SERVER/prometheus:latest" ./prometheus
          docker push "$ACR_LOGIN_SERVER/prometheus:latest"
          docker build -t "$ACR_LOGIN_SERVER/grafana:latest" ./grafana
          docker push "$ACR_LOGIN_SERVER/grafana:latest"

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Post-deploy health check
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "https://$FQDN/health"; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 6s..."
            sleep 6
          done
          echo "Health check failed after 10 attempts" >&2
          exit 1
