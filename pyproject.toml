[project]
name = "predictive_monitoring_tool"
version = "0.1.0"
description = "Predictive AIOps: synthetic metrics generator, anomaly detection, and diagnosis agent."
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.4",
    "mcp[cli]>=1.28,<2",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.9",
    "langchain-openai>=1.4.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
    "testcontainers>=4.8",
]
notebooks = [
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[project.scripts]
pmt-mcp = "predictive_monitoring_tool.mcp_server.__main__:main"
pmt-poll = "predictive_monitoring_tool.orchestration.job:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_monitoring_tool"]

[tool.pytest.ini_options]
markers = ["docker: needs a local Docker daemon (opt-in)"]
addopts = "-m 'not docker'"
