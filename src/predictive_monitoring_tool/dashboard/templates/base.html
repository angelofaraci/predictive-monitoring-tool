<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>predictive monitoring tool{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="app-name" href="/dashboard">predictive monitoring tool</a>
    {% if view %}
    <span class="mode-badge {{ 'mode-demo' if view.demo else 'mode-live' }}">{{ view.mode_label }}</span>
    {% endif %}
    <nav class="app-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/setup">Setup</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
